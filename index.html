<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Өөрийгөө танин мэдэх тест</title>

<style>
/* ===== Animations ===== */
@keyframes popIn {
  0% { transform: scale(0.8); opacity: 0; }
  60% { transform: scale(1.1); opacity: 1; }
  100% { transform: scale(1); }
}

@keyframes sparkleFlash {
  0%,100% { opacity: 0; transform: scale(0.5); }
  50% { opacity: 1; transform: scale(1.2); }
}

/* ===== Base ===== */
body {
  font-family: "Segoe UI", Tahoma, sans-serif;
  margin: 0;
  padding: 16px;
  background: #fdf6f0;
  color: #333;
}

h1 {
  text-align: center;
  color: #ce2b7f;
  font-size: 24px;
  margin-bottom: 20px;
}

form {
  max-width: 820px;
  margin: auto;
}

/* ===== Questions ===== */
.question {
  background: #fff8f2;
  border: 1px solid #ff7ea9;
  padding: 12px;
  margin-bottom: 12px;
  border-radius: 14px;
  box-shadow: 0 2px 6px rgba(0,0,0,.08);
  display: flex;
  gap: 12px;
}

.question p {
  flex: 1;
  margin: 0;
  font-weight: 600;
  color: #5c3d2e;
}

.answers {
  flex: 1.3;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

label {
  font-size: 14px;
  cursor: pointer;
}

input[type="radio"] {
  accent-color: #f97bbc;
  margin-right: 6px;
}

/* ===== Button ===== */
button {
  width: 100%;
  margin: 25px 0;
  padding: 14px;
  background: #f97bbc;
  color: white;
  border: none;
  border-radius: 25px;
  font-size: 18px;
  cursor: pointer;
}

/* ===== Result ===== */
#result {
  max-width: 600px;
  margin: 20px auto;
  padding: 18px;
  border: 2px dashed #ffd1aa;
  border-radius: 16px;
  background: #fff4e9;
  text-align: center;
  font-size: 16px;
}

.animated-result {
  animation: popIn .6s ease-out;
  position: relative;
}

.sparkle::after {
  content: "✨";
  position: absolute;
  top: -10px;
  right: -10px;
  animation: sparkleFlash 1s ease-in-out;
}

/* ===== Canvas ===== */
#resultChart {
  display: none;
  margin: 20px auto;
  max-width: 100%;
}

/* ===== Mobile ===== */
@media (max-width: 768px) {
  .question {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<h1>Гадаад, дотоод өөрийгөө таних чадвар</h1>

<form id="quizForm">
<script>
const questions = [
"Би өөрийн үнэт зүйлсийг тодорхой мэддэг.",
"Би өөрийн давуу ба сул талаа сайн мэддэг.",
"Би ямар орчинд үр бүтээлтэй ажилладгаа мэддэг.",
"Би сэтгэл хөдлөлөө удирдаж чаддаг.",
"Би шийдвэртээ юу нөлөөлдгийг мэддэг.",
"Би бусдад хэрхэн нөлөөлдөгөө ухамсарладаг.",
"Миний зорилго үнэт зүйлстэйгээ нийцдэг.",
"Би бусдын санал бодлыг сонсдог.",
"Хүмүүсийн хэлснийг анхааралтай сонсдог.",
"Би бусдын сэтгэл хөдлөлийг анзаардаг.",
"Надад итгэдэг түвшинг мэддэг.",
"Би үг үйлдлээ бодолцдог.",
"Санал шүүмжлэлийг ашигладаг.",
"Бусад хүмүүс намайг хэрхэн хардагийг мэддэг."
];

for(let i=1;i<=14;i++){
  document.write(`
  <div class="question">
    <p>${i}. ${questions[i-1]}</p>
    <div class="answers">
      <label><input type="radio" name="q${i}" value="1"> Огт үнэн биш</label>
      <label><input type="radio" name="q${i}" value="2"> Бараг үнэн биш</label>
      <label><input type="radio" name="q${i}" value="3"> Заримдаа</label>
      <label><input type="radio" name="q${i}" value="4"> Ихэнхдээ үнэн</label>
      <label><input type="radio" name="q${i}" value="5"> Бүрэн үнэн</label>
    </div>
  </div>`);
}
</script>

<button type="button" onclick="calculateResult()">Илгээх</button>
</form>

<div id="result"></div>
<canvas id="resultChart"></canvas>

<script>
function calculateResult(){
  let internal=0, external=0;

  for(let i=1;i<=14;i++){
    const checked=document.querySelector(`input[name="q${i}"]:checked`);
    if(!checked){ alert("Бүх асуултад хариулна уу"); return; }
    if(i<=7) internal+=+checked.value;
    else external+=+checked.value;
  }

  let type="";
  if(internal<=17 && external<=17) type="Хайгч";
  else if(internal>=18 && external<=17) type="People pleaser";
  else if(internal<=17 && external>=18) type="Интроспектор";
  else type="Танин мэдсэн";

  document.getElementById("result").innerHTML=`
  <div class="animated-result sparkle">
    <b>Internal:</b> ${internal}<br>
    <b>External:</b> ${external}<br><br>
    <b>Таны хэв маяг:</b> ${type}
  </div>`;

  drawGraph(internal,external);
}

function drawGraph(internal, external) {
  const canvas = document.getElementById("resultChart");
  canvas.style.display = "block";
  

  const isMobile = window.innerWidth < 600;
  const qx = isMobile ? 32 : 0; // horizontal shift
  const qy = isMobile ? 22 : 0; // vertical shift


  canvas.width = isMobile ? window.innerWidth - 24 : 560;
  canvas.height = isMobile ? canvas.width : 460;

  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const padding = isMobile ? 50 : 70;
  const w = canvas.width - padding * 2;
  const h = canvas.height - padding * 2;

  const midX = padding + w / 2;
  const midY = padding + h / 2;

  ctx.font = isMobile ? "12px Segoe UI" : "15px Segoe UI";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  /* ===== AXES ===== */
  ctx.strokeStyle = "#1f3c88";
  ctx.lineWidth = 3;

  // Y axis
  ctx.beginPath();
  ctx.moveTo(padding, padding);
  ctx.lineTo(padding, padding + h);
  ctx.stroke();

  // X axis
  ctx.beginPath();
  ctx.moveTo(padding, padding + h);
  ctx.lineTo(padding + w, padding + h);
  ctx.stroke();

/* ===== Middle dashed lines ===== */
ctx.save(); // state хадгална

ctx.strokeStyle = "rgba(31,60,136,0.25)"; // маш бүдэг
ctx.lineWidth = 2;
ctx.setLineDash([6, 6]); // тасархай

// Middle vertical
ctx.beginPath();
ctx.moveTo(midX, padding);
ctx.lineTo(midX, padding + h);
ctx.stroke();

// Middle horizontal
ctx.beginPath();
ctx.moveTo(padding, midY);
ctx.lineTo(padding + w, midY);
ctx.stroke();

ctx.restore(); // өмнөх style-руу буцаана

  /* ===== Axis labels ===== */
  ctx.fillStyle = "#000";

  ctx.fillText("Өндөр", padding - 30, padding);
  ctx.fillText("Бага", padding - 30, padding + h);

  ctx.fillText("Бага", padding, padding + h + 30);
  ctx.fillText("Өндөр", padding + w, padding + h + 30);

  // Axis titles
  if (!isMobile) {
  ctx.save();
  ctx.translate(padding - 50, padding + h / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText("Өөрийгөө танин мэдсэн түвшин", 0, 0);
  ctx.restore();

  ctx.fillText(
    "Бусдын өнцгөөс өөрийгөө танин мэдсэн түвшин",
    padding + w / 2,
    padding + h + 55
  );
}


/* ===== Quadrant texts ===== */
ctx.font = isMobile ? "12px Segoe UI" : "15px Segoe UI"; // bold арилгасан


// Top-left
ctx.fillStyle = "#e81f76";
ctx.fillText(
  "Интроспектор / Ажигч",
  padding + w * 0.25 ,
  padding + h * 0.25
);

// Top-right
ctx.fillStyle = "#ee7623";
ctx.fillText(
  "Танин мэдсэн",
  padding + w * 0.75,
  padding + h * 0.25
);

// Bottom-left
ctx.fillStyle = "#00b140";
ctx.fillText(
  "Хайгч",
  padding + w * 0.25,
  padding + h * 0.75
);

// Bottom-right
ctx.fillStyle = "#0099a8";
ctx.fillText(
  "Бусдын аяыг харагч",
  padding + w * 0.75,
  padding + h * 0.75
);

ctx.fillStyle = "#000";

  /* ===== Score point ===== */
  const x = padding + ((external - 7) / 28) * w;
  const y = padding + h - ((internal - 7) / 28) * h;

  // Glow
  ctx.beginPath();
  ctx.arc(x, y, isMobile ? 10 : 14, 0, Math.PI * 2);

  ctx.fillStyle = "rgba(112,38,239,0.25)";
  ctx.fill();

  // Dot
  ctx.beginPath();
  ctx.arc(x, y, isMobile ? 5 : 7, 0, Math.PI * 2);
  ctx.fillStyle = "#7026EF";
  ctx.fill();

  ctx.font = "bold 14px Segoe UI";
  ctx.fillText(isMobile ? "Оноо" : "Таны оноо", x, y - 16);

}


</script>


</body>
</html>
